name: Build Android APK

on:
  push:
    branches:
      - claude/quran-ui-redesign-CSyp7
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Initialize EAS project
        run: |
          echo "=== Running eas init ==="
          eas init --non-interactive
          echo "=== app.json after init ==="
          cat app.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('projectId:', d.get('expo',{}).get('extra',{}).get('eas',{}).get('projectId','NOT SET'))"

      - name: Build APK on EAS Cloud
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait
