name: Build Android APK

on:
  push:
    branches:
      - claude/quran-ui-redesign-CSyp7
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project
        run: eas init --id d7af4510-f0d7-4f27-b5a6-e89623e1bc1c --non-interactive --force

      - name: Build APK on EAS Cloud
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait
