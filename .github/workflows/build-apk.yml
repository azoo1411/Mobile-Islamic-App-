name: Build Android APK

on:
  push:
    branches: [ main, claude/arabic-islamic-app-j58zT ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: بناء ملف APK
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: قبول licenses وتثبيت NDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" || true
          echo "NDK path: $ANDROID_SDK_ROOT/ndk/27.0.12077973"
          ls $ANDROID_SDK_ROOT/ndk/ || true

      - name: إنشاء local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: تثبيت التبعيات
        run: flutter pub get

      - name: توليد ملفات Drift
        run: dart run build_runner build --delete-conflicting-outputs

      - name: بناء APK
        run: flutter build apk --release --no-tree-shake-icons
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: عرض Gradle log عند الفشل
        if: failure()
        run: |
          find . -name "*.log" -path "*/build/*" 2>/dev/null | head -5 | xargs cat 2>/dev/null || true
          cat android/app/build/outputs/logs/manifest-merger-release-report.txt 2>/dev/null || true

      - name: البحث عن ملف APK
        if: success()
        run: find build -name "*.apk" 2>/dev/null

      - name: رفع ملف APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: islamic-app-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
